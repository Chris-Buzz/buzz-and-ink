<!DOCTYPE html>
<html lang="en" data-theme="light" data-radius="standard" data-contrast="standard" data-accent="buzz" data-neutral="warm" data-paper="cream">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digby — Mission Control</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380;0,9..144,450;0,9..144,550;1,9..144,420&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  .mc-brand{font-family:var(--bi-font-mono);font-size:12px;letter-spacing:.16em;font-weight:700}
  .mc-brand b{color:var(--bi-accent)}
  .mc-page{display:flex;flex-direction:column;gap:26px;max-width:1060px}
  .mc-statrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
  .mc-cols{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:18px;align-items:start}
  @media (max-width: 900px){.mc-cols{grid-template-columns:1fr}}
  .mc-form{display:flex;flex-direction:column;gap:16px}
  .mc-foot{font-family:var(--bi-font-mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--bi-text-3);padding:8px 0 20px}
</style>
</head>
<body class="bi">
  <div id="root"></div>
  <script type="module" src="./app.tsx"></script>
</body>
</html>
