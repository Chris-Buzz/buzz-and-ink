<!DOCTYPE html>
<html lang="en" data-theme="light" data-radius="standard" data-contrast="standard" data-accent="buzz" data-neutral="warm" data-paper="cream">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Buzz &amp; Ink × Astryx</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,380;0,9..144,450;0,9..144,550;1,9..144,420&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  .wrap{max-width:1120px;margin:0 auto;padding:0 32px}
  .bar{position:sticky;top:0;z-index:50;border-bottom:1px solid var(--bi-line);padding:12px 0;
    background:color-mix(in srgb,var(--bi-bg) 88%,transparent);backdrop-filter:blur(10px)}
  .bar .wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .brand{font-family:var(--bi-font-mono);font-size:12px;letter-spacing:.16em;font-weight:700}
  .brand b{color:var(--bi-accent)}
  .ctl{display:flex;align-items:center;gap:8px}
  .ctl > label{font-family:var(--bi-font-mono);font-size:10px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--bi-text-3)}
  section{padding:40px 0 8px}
  .sec-head{display:flex;align-items:baseline;gap:16px;margin-bottom:20px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
  footer{padding:56px 0 80px;color:var(--bi-text-3);font-family:var(--bi-font-mono);
    font-size:11px;letter-spacing:.1em;line-height:1.8}
</style>
</head>
<body class="bi">
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
